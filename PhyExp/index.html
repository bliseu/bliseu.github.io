<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="大学物理实验工具集：面向教材二维码的实验数据处理程序集，含最小二乘法直线拟合、李萨如图形等，本地运行、免安装。">
<title>大学物理实验工具集 · PhyExp</title>
<script>
(function(){try{var p=localStorage.getItem('phyexp-theme')||'auto';var t=(p==='light'||p==='dark')?p:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<style>
:root{
  color-scheme:dark;
  --blue:#2a78d6; --cyan:#5cc0ff; --ink:#e8eefc; --muted:#aebdd6;
  --overline:#7fa8dd; --hero-en:#8fb6e8; --email-hover:#8fb6e8;
  --h1-grad:linear-gradient(100deg,#dceaff 10%,#5cc0ff 55%,#2a78d6 90%);
  --pill-fg:#bcd3f2; --pill-border:rgba(140,180,235,.35); --pill-bg:rgba(255,255,255,.04);
  --card-bg:rgba(255,255,255,.045); --card-border:rgba(150,185,235,.16);
  --card-hover-bg:rgba(255,255,255,.07); --card-hover-border:rgba(92,192,255,.55);
  --card-shadow:0 14px 36px rgba(15,70,160,.35);
  --tool-en:#7fa8dd;
  --badge-fg:#07162b; --badge-grad:linear-gradient(120deg,#5cc0ff,#8ee0c0);
  --footer:#7688a8;
  --bg0:#17335f; --bg1:#0c1730; --bg2:#070f1e;
}
:root[data-theme="light"]{
  color-scheme:light;
  --blue:#1a63c4; --cyan:#0f6fc9; --ink:#1b2a44; --muted:#5a6b85;
  --overline:#3a6ea5; --hero-en:#2f6db0; --email-hover:#2f6db0;
  --h1-grad:linear-gradient(100deg,#123a66 10%,#0f6fc9 55%,#1a6fe0 90%);
  --pill-fg:#3c5a80; --pill-border:rgba(30,90,160,.25); --pill-bg:rgba(255,255,255,.55);
  --card-bg:rgba(255,255,255,.72); --card-border:rgba(30,90,160,.14);
  --card-hover-bg:#ffffff; --card-hover-border:rgba(26,111,224,.5);
  --card-shadow:0 14px 36px rgba(30,90,160,.16);
  --tool-en:#3a6ea5;
  --badge-fg:#0b2f5b; --badge-grad:linear-gradient(120deg,#2f8bf0,#3cc7a8);
  --footer:#6b7d99;
  --bg0:#cfe2f7; --bg1:#eaf2fb; --bg2:#f7faff;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--ink);line-height:1.6;
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:radial-gradient(1100px 700px at 72% -12%, var(--bg0) 0%, var(--bg1) 52%, var(--bg2) 100%) fixed;
  overflow-x:hidden;
}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.55;pointer-events:none}
:root[data-theme="light"] #bg{opacity:.42}
.theme-btn{
  position:fixed;top:14px;right:14px;z-index:10;
  width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.15rem;line-height:1;cursor:pointer;
  color:var(--ink);background:var(--card-bg);border:1px solid var(--card-border);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .2s ease,border-color .2s ease,background .2s ease,color .2s ease;
}
.theme-btn:hover{transform:translateY(-2px);border-color:var(--card-hover-border);background:var(--card-hover-bg)}
.theme-btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:max(7vh,48px) 20px 56px;display:flex;flex-direction:column;min-height:100vh}
.hero{text-align:center;margin-bottom:44px}
.overline{font-size:.75rem;letter-spacing:.42em;text-indent:.42em;color:var(--overline);text-transform:uppercase;margin:0 0 14px}
h1{
  margin:0;font-size:clamp(1.7rem,5.4vw,2.7rem);font-weight:800;letter-spacing:.04em;
  background:var(--h1-grad);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--cyan);
}
.hero .en{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:.95rem;color:var(--hero-en);margin:10px 0 0;letter-spacing:.06em}
.hero .sub{font-size:.92rem;color:var(--muted);margin:16px auto 0;max-width:34em}
.pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.pill{font-size:.76rem;color:var(--pill-fg);border:1px solid var(--pill-border);border-radius:999px;padding:4px 12px;background:var(--pill-bg)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.tool{
  position:relative;display:block;text-decoration:none;color:inherit;
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-radius:16px;padding:24px 22px 20px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease,background .25s ease;
  animation:rise .55s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.tool:hover,.tool:focus-visible{
  transform:translateY(-5px);
  border-color:var(--card-hover-border);
  background:var(--card-hover-bg);
  box-shadow:var(--card-shadow);
  outline:none;
}
.tool .ico{font-size:2rem;line-height:1}
.tool h3{margin:14px 0 2px;font-size:1.1rem;letter-spacing:.02em}
.tool .en{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:.78rem;color:var(--tool-en)}
.tool p{font-size:.88rem;color:var(--muted);margin:10px 0 0;min-height:3.4em}
.go{display:inline-block;margin-top:14px;font-size:.86rem;color:var(--cyan);transition:transform .25s ease}
.tool:hover .go{transform:translateX(5px)}
.badge{
  display:inline-block;vertical-align:.25em;margin-left:6px;
  font-size:.66rem;font-weight:700;color:var(--badge-fg);letter-spacing:.08em;
  background:var(--badge-grad);border-radius:999px;padding:2px 9px;
}
.tool.soon{border-style:dashed;opacity:.6;animation-delay:.28s}
.tool.soon p{min-height:auto}
footer{margin-top:auto;padding-top:46px;text-align:center;font-size:.78rem;color:var(--footer)}
footer p{margin:0}
.foot-stat{margin-top:8px;font-size:.7rem;opacity:.85;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.foot-email{margin-top:6px;color:transparent;transition:color .2s}
.foot-email:hover{color:var(--email-hover)}
@media (prefers-reduced-motion: reduce){
  .tool{animation:none}
  #bg{display:none}
}
</style>
</head>
<body>

<button id="themeBtn" class="theme-btn" type="button" aria-label="切换颜色模式" title="切换：自动 / 浅色 / 深色">
  <span id="themeIcon" aria-hidden="true">◐</span>
</button>

<canvas id="bg" aria-hidden="true"></canvas>

<div class="wrap">
  <header class="hero">
    <p class="overline">Physics Lab Toolkit</p>
    <h1>大学物理实验工具集</h1>
    <p class="en">Tools for Physics Experiments</p>
    <p class="sub">扫码即用 · 免安装 · 所有计算均在本地浏览器完成，实验数据不出本机（页脚仅统计访问量）</p>
    <div class="pills" aria-hidden="true">
      <span class="pill">手机 / 平板 / 电脑</span>
      <span class="pill">离线可用</span>
      <span class="pill">零依赖</span>
    </div>
  </header>

  <!-- 工具卡片由脚本渲染；新增工具只需在下方 TOOLS 数组加一行 -->
  <section class="tools" id="tools" aria-label="工具列表"></section>

  <footer>
    <p>© 2026 南京邮电大学　保留所有权利</p>
    <!-- 免费访问统计（不蒜子 busuanzi）：联网时显示本站访问量与访客数，离线/失败时自动隐藏。
         计数按域名 libinlab.cn 累计（即 /PhyExp 各页共用）；如需停用，删除本块与 </body> 前的统计脚本即可。 -->
    <p class="foot-stat">
      <span id="busuanzi_container_site_pv" style="display:none">本站访问 <span id="busuanzi_value_site_pv"></span> 次</span>
      <span id="busuanzi_container_site_uv" style="display:none"> · 访客 <span id="busuanzi_value_site_uv"></span> 人</span>
    </p>
    <p class="foot-email">E-mail: libin A~T njupt.edu.cn</p>
  </footer>
</div>

<script>
'use strict';
/* =====================================================
   工具注册表（★ 扩展接口 ★）
   将来加入新页面：在数组中追加一个对象即可，卡片自动生成。
   { ico: 图标emoji, title: 中文名, en: 英文名,
     desc: 一句话简介, url: 页面文件名, badge: 可选角标 }
   ===================================================== */
var TOOLS = [
  {
    ico:'📈',
    title:'最小二乘法直线拟合',
    en:'Least Squares Fitting',
    desc:'输入实验数据，自动计算斜率、截距与不确定度，并绘制拟合图。',
    url:'least-squares.html'
  },
  {
    ico:'〰️',
    title:'李萨如图形',
    en:'Lissajous Figures',
    desc:'设定两通道频率比与相位差，观察相互垂直振动的合成轨迹，支持动画演示。',
    url:'lissajous.html',
    badge:'新'
  },
  {
    ico:'🌀',
    title:'扭摆法测转动惯量',
    en:'Torsion Pendulum',
    desc:'输入周期、质量与几何尺寸，自动标定扭转常数 K，计算转动惯量理论值、实验值与百分差。',
    url:'torsion-pendulum.html',
    badge:'新'
  },
  {
    ico:'🌊',
    title:'受迫振动的研究',
    en:'Forced Vibration',
    desc:'处理实验数据：绘制可取点的 T₀-θ 曲线、幅频特性与相频特性曲线。',
    url:'forced-vibration.html',
    badge:'新'
  },
  {
    ico:'🎯',
    title:'迈克耳孙干涉仪测波长',
    en:'Michelson Interferometer',
    desc:'模拟转动微调手轮数环读数，三部分读数求动镜位置，逐差法测 He-Ne 激光波长。',
    url:'michelson.html',
    badge:'新'
  },
  {
    ico:'🔬',
    title:'牛顿环法测曲率半径',
    en:"Newton's Rings",
    desc:'模拟读数显微镜左右测环读数，主尺＋鼓轮读数，逐差法与最小二乘法求曲率半径。',
    url:'newton-rings.html',
    badge:'新'
  },
  {
    ico:'🔊',
    title:'声速的测量',
    en:'Speed of Sound',
    desc:'模拟示波器驻波波形与李萨如图形随接收端位置联动变化，游标卡尺读数，逐差法与最小二乘法求声速。',
    url:'sound-velocity.html',
    badge:'新'
  },
  {
    ico:'🔭',
    title:'分光计',
    en:'Spectrometer',
    desc:'分光计俯视图与目镜视场联动，白光反射法测三棱镜顶角，光栅衍射观察汞灯/氦灯谱线，最小二乘法求光栅常数并测氦灯波长。',
    url:'spectrometer.html',
    badge:'新'
  },
  {
    ico:'⚡',
    title:'电介质介电常数的测量',
    en:'Dielectric Constant',
    desc:'模拟螺旋测微器调节极板间距、放入/取出 PET 薄片并读电容，平均法与最小二乘法测固体相对介电常数和空气介电常数。',
    url:'dielectric.html',
    badge:'新'
  },
  {
    ico:'🔋',
    title:'电位差计测量电动势',
    en:'Potentiometer',
    desc:'模拟十一线电位差计接线、工作电流标准化（定标）与补偿法测量，三种校正系数测干电池电动势并合成不确定度。',
    url:'potentiometer.html',
    badge:'新'
  },
  {
    ico:'🧲',
    title:'电表改装',
    en:'Meter Conversion',
    desc:'模拟半偏法测微安表头内阻，改装双量程毫安表与双量程电压表，接线校准、按最大引用误差定级并绘制校正折线。',
    url:'meter-conversion.html',
    badge:'新'
  }
];

(function render(){
  var box = document.getElementById('tools');
  TOOLS.forEach(function(t, i){
    var a = document.createElement('a');
    a.className = 'tool';
    a.href = t.url;
    a.style.animationDelay = (i*90)+'ms';
    a.innerHTML =
      '<div class="ico">'+t.ico+'</div>' +
      '<h3>'+t.title+(t.badge ? ' <span class="badge">'+t.badge+'</span>' : '')+'</h3>' +
      '<div class="en">'+t.en+'</div>' +
      '<p>'+t.desc+'</p>' +
      '<span class="go">进入 →</span>';
    box.appendChild(a);
  });
  var soon = document.createElement('div');
  soon.className = 'tool soon';
  soon.innerHTML =
    '<div class="ico">✨</div>' +
    '<h3>更多工具</h3>' +
    '<div class="en">Coming Soon</div>' +
    '<p>开发中，敬请期待。</p>';
  box.appendChild(soon);
})();

/* ---------- 深浅色自适应（自动 / 浅色 / 深色） ---------- */
(function(){
  var root = document.documentElement, KEY = 'phyexp-theme';
  var mq = matchMedia('(prefers-color-scheme: dark)');
  var pref = null;
  try { pref = localStorage.getItem(KEY) || 'auto'; } catch(e){ pref = 'auto'; }
  function resolve(p){ return p === 'light' || p === 'dark' ? p : (mq.matches ? 'dark' : 'light'); }
  function iconFor(p){ return p === 'light' ? '☀' : p === 'dark' ? '☾' : '◐'; }
  function apply(p){
    root.setAttribute('data-theme', resolve(p));
    var ic = document.getElementById('themeIcon');
    if (ic) ic.textContent = iconFor(p);
  }
  apply(pref);
  var btn = document.getElementById('themeBtn');
  if (btn) btn.addEventListener('click', function(){
    pref = pref === 'auto' ? 'light' : pref === 'light' ? 'dark' : 'auto';
    try { localStorage.setItem(KEY, pref); } catch(e){}
    apply(pref);
  });
  // 老浏览器（Safari≤13 等）MediaQueryList 只有 addListener，需回退
  var onScheme = function(){ if (pref === 'auto') apply('auto'); };
  if (typeof mq.addEventListener === 'function') mq.addEventListener('change', onScheme);
  else if (typeof mq.addListener === 'function') mq.addListener(onScheme);
})();

/* ---------- 背景：缓慢演化的李萨如曲线（纯装饰） ---------- */
(function(){
  var cv = document.getElementById('bg'), ctx = cv.getContext('2d'), raf = null;
  function resize(){ cv.width = innerWidth; cv.height = innerHeight; }
  addEventListener('resize', resize); resize();

  function draw(ts){
    var w = cv.width, h = cv.height, t = ts/1000;
    ctx.clearRect(0,0,w,h);
    var cx = w/2, cy = h*0.44, S = Math.min(w,h)*0.38;
    ctx.save();
    ctx.translate(cx,cy);
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    var hue = Math.round(208 + 26*Math.sin(t*0.22));
    ctx.strokeStyle = light ? 'hsla('+hue+',55%,42%,0.42)' : 'hsla('+hue+',85%,66%,0.5)';
    ctx.lineWidth = 1.6;
    ctx.shadowColor = light ? 'rgba(40,110,200,0.35)' : 'rgba(70,150,255,0.75)';
    ctx.shadowBlur = light ? 12 : 20;
    ctx.beginPath();
    for(var i=0;i<=1400;i++){
      var th = i/1400 * 2*Math.PI;
      var x = S*Math.sin(3*th + t*0.55);
      var y = S*Math.sin(4*th + t*0.18);
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    }
    ctx.stroke();
    ctx.restore();
  }
  function loop(ts){ draw(ts); raf = requestAnimationFrame(loop); }

  if (matchMedia('(prefers-reduced-motion: reduce)').matches){
    draw(0);                                    // 静态单帧
  } else {
    raf = requestAnimationFrame(loop);
    document.addEventListener('visibilitychange', function(){
      if (document.hidden){ if(raf){cancelAnimationFrame(raf); raf=null;} }
      else if (!raf){ raf = requestAnimationFrame(loop); }
    });
  }
})();
</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
